<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Slate Background for Android / iOS PWA -->
  <rect width="512" height="512" rx="128" fill="#020817" />
  
  <!-- Emerald Squircle Container -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.7" />

  <!-- BSKJI Government Landmark Emblem -->
  <g transform="translate(136, 105) scale(10)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Star -->
    <path d="M12 2l1.2 2.5 2.8.4-2 2 .5 2.8L12 8.4l-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5" transform="scale(0.85) translate(2, -2)" />
    <!-- Roof pediment -->
    <polygon points="12 4 21 9 3 9" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.8"></polygon>
    <line x1="2" y1="10" x2="22" y2="10" stroke="#ffffff" stroke-width="2"></line>
    <!-- Columns -->
    <line x1="5" y1="11" x2="5" y2="18" stroke="#ffffff" stroke-width="2.2"></line>
    <line x1="9.6" y1="11" x2="9.6" y2="18" stroke="#ffffff" stroke-width="2.2"></line>
    <line x1="14.4" y1="11" x2="14.4" y2="18" stroke="#ffffff" stroke-width="2.2"></line>
    <line x1="19" y1="11" x2="19" y2="18" stroke="#ffffff" stroke-width="2.2"></line>
    <!-- Base -->
    <line x1="3" y1="19" x2="21" y2="19" stroke="#ffffff" stroke-width="2"></line>
    <line x1="1" y1="22" x2="23" y2="22" stroke="url(#goldGrad)" stroke-width="2.5"></line>
  </g>

  <!-- BSKJI Badge -->
  <g transform="translate(136, 380)">
    <rect x="0" y="0" width="240" height="56" rx="28" fill="#020817" fill-opacity="0.9" stroke="url(#goldGrad)" stroke-width="2.5" />
    <text x="120" y="37" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">BSKJI</text>
  </g>
</svg>